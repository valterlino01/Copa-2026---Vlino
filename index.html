// PESOS POR FASE (bolão progressivo)
// ══════════════════════════════════════════════════════
const PHASE_WEIGHT = {
  "Grupos": 1,
  "2ª Fase": 1,      // 16avos
  "Oitavas": 1.5,
  "Quartas": 2,
  "Semifinal": 3,
  "3º Lugar": 2,
  "Final": 4,
};
function phaseWeight(phase){ return PHASE_WEIGHT[phase] || 1; }
// Bônus por acertar quem avança no mata-mata
const ADVANCE_BONUS = 2;
// Fases de mata-mata (têm "quem avança" e prorrogação/pênaltis)
function isKnockout(phase){ return phase !== "Grupos" && phase !== undefined; }
function isKnockoutMatch(m){ return m.phase !== "Grupos"; }

// ══════════════════════════════════════════════════════
// CLASSIFICAÇÃO DOS GRUPOS (dinâmica)
// ══════════════════════════════════════════════════════
const GROUP_LETTERS = ["A","B","C","D","E","F","G","H","I","J","K","L"];

// Monta tabela de um grupo a partir dos resultados oficiais.
// Retorna array ordenado de {team, flag, group, pts, j, v, e, d, gp, gc, sg, tieFlag}
function computeGroupTable(groupLetter, results){
  const matches = SCHEDULE.filter(m => m.phase==="Grupos" && m.group===groupLetter);
  const teams = {};
  function ensure(name, flag){
    if(!teams[name]) teams[name] = {team:name, flag:flag, group:groupLetter, pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0};
    return teams[name];
  }
  matches.forEach(m => {
    ensure(m.home, m.homeFlag); ensure(m.away, m.awayFlag);
    const r = results[m.id];
    if(!r || r.homeScore===null || r.homeScore===undefined || r.awayScore===null || r.awayScore===undefined) return;
    const h = parseInt(r.homeScore), a = parseInt(r.awayScore);
    const th = teams[m.home], ta = teams[m.away];
    th.j++; ta.j++; th.gp+=h; th.gc+=a; ta.gp+=a; ta.gc+=h;
    if(h>a){ th.v++; th.pts+=3; ta.d++; }
    else if(h<a){ ta.v++; ta.pts+=3; th.d++; }
    else { th.e++; ta.e++; th.pts++; ta.pts++; }
  });
  const arr = Object.values(teams).map(t => ({...t, sg: t.gp - t.gc}));
  // Ordena: Pts > SG > GP. Marca tieFlag quando houver empate nesses 3 critérios.
  arr.sort((x,y) => y.pts-x.pts || y.sg-x.sg || y.gp-x.gp);
  for(let i=0;i<arr.length-1;i++){
    const a=arr[i], b=arr[i+1];
    if(a.pts===b.pts && a.sg===b.sg && a.gp===b.gp){ a.tieFlag=true; b.tieFlag=true; }
  }
  return arr;
}

// Computa todas as 12 tabelas + ranking de terceiros.
function computeAllGroups(results, manualOrder){
  const tables = {};
  GROUP_LETTERS.forEach(g => {
    let t = computeGroupTable(g, results);
    // Aplica ordenação manual (override) se existir para este grupo
    const mo = manualOrder && manualOrder["group_"+g];
    if(mo && Array.isArray(mo) && mo.length===t.length){
      const byName = {}; t.forEach(x => byName[x.team]=x);
      const reordered = mo.map(n => byName[n]).filter(Boolean);
      if(reordered.length===t.length) t = reordered;
    }
    tables[g] = t;
  });
  return tables;
}

// Ranking dos 12 terceiros colocados (Pts > SG > GP).
function computeThirdsRanking(tables){
  const thirds = [];
  GROUP_LETTERS.forEach(g => {
    const t = tables[g];
    if(t && t[2]) thirds.push({...t[2]});
  });
  thirds.sort((x,y) => y.pts-x.pts || y.sg-x.sg || y.gp-x.gp);
  for(let i=0;i<thirds.length-1;i++){
    const a=thirds[i], b=thirds[i+1];
    if(a.pts===b.pts && a.sg===b.sg && a.gp===b.gp){ a.tieFlag=true; b.tieFlag=true; }
  }
  return thirds; // os 8 primeiros classificam
}

// Verifica se a fase de grupos terminou (todos os 72 jogos com resultado).
function groupStageComplete(results){
  const gm = SCHEDULE.filter(m => m.phase==="Grupos");
  return gm.every(m => {
    const r = results[m.id];
    return r && r.homeScore!==null && r.homeScore!==undefined && r.awayScore!==null && r.awayScore!==undefined;
  });
}

// ══════════════════════════════════════════════════════
// RESOLUÇÃO DE SLOTS / PROPAGAÇÃO DO CHAVEAMENTO
// ══════════════════════════════════════════════════════
// Resolve um slot (group/third/winner/loser) para {team, flag} ou null se indefinido.
// manualThirds: objeto {matchId: "Nome da seleção"} escolhido pelo admin para slots "third".
function resolveSlot(slot, ctx){
  if(!slot) return null;
  const {tables, thirdsRanking, results, manualThirds, matchId} = ctx;
  if(slot.t==="group"){
    const t = tables[slot.g];
    if(t && t[slot.pos-1] && t[slot.pos-1].j>0){
      const tm = t[slot.pos-1];
      // ainda incerto se grupo não terminou
      const grpDone = SCHEDULE.filter(m=>m.phase==="Grupos"&&m.group===slot.g).every(m=>{
        const r=results[m.id]; return r&&r.homeScore!==null&&r.homeScore!==undefined;
      });
      return {team:tm.team, flag:tm.flag, certain:grpDone && !tm.tieFlag};
    }
    return null;
  }
  if(slot.t==="third"){
    // Precisa de escolha manual OU dos 8 melhores definidos
    if(manualThirds && manualThirds[matchId]){
      // Procura flag da seleção escolhida
      let flag="🏳️";
      GROUP_LETTERS.forEach(g => (tables[g]||[]).forEach(t => { if(t.team===manualThirds[matchId]) flag=t.flag; }));
      return {team:manualThirds[matchId], flag:flag, certain:true, manual:true};
    }
    return null; // fica amarelo para admin escolher
  }
  if(slot.t==="winner" || slot.t==="loser"){
    const r = results[slot.of];
    if(!r || r.homeScore===null || r.homeScore===undefined) return null;
    const src = SCHEDULE.find(m => m.id===slot.of);
    if(!src) return null;
    const hWin = parseInt(r.homeScore) > parseInt(r.awayScore);
    const aWin = parseInt(r.awayScore) > parseInt(r.homeScore);
    let winnerSide = null;
    if(hWin) winnerSide="home"; else if(aWin) winnerSide="away";
    else winnerSide = r.advance; // empate: usa quem avança (pênaltis) definido pelo admin
    if(!winnerSide) return null;
    const wantWinner = slot.t==="winner";
    const side = wantWinner ? winnerSide : (winnerSide==="home"?"away":"home");
    const resolvedHome = resolveMatchTeam(src, "home", ctx);
    const resolvedAway = resolveMatchTeam(src, "away", ctx);
    const chosen = side==="home" ? resolvedHome : resolvedAway;
    if(!chosen) return null;
    return {team:chosen.team, flag:chosen.flag, certain:chosen.certain!==false};
  }
  return null;
}

// Resolve o time de um lado de uma partida (recursivo via slots).
function resolveMatchTeam(match, side, ctx){
  const slot = side==="home" ? match.homeSlot : match.awaySlot;
  if(!slot) return null;
  return resolveSlot(slot, {...ctx, matchId: match.id});
}

// Retorna {home:{team,flag,certain}|null, away:{...}|null} para um jogo de mata-mata.
function resolveKnockoutMatch(match, ctx){
  return {
    home: resolveMatchTeam(match, "home", ctx),
    away: resolveMatchTeam(match, "away", ctx),
  };
}


// ══════════════════════════════════════════════════════
// PONTUAÇÃO
// ══════════════════════════════════════════════════════
// Pontos BRUTOS do placar (sem peso de fase). Base usada em todo lugar.
function calcScore(guess, actual) {
  if (!actual || actual.homeScore === null || actual.awayScore === null) return null;
  if (guess.homeScore === null || guess.awayScore === null) return 0;
  const gH = parseInt(guess.homeScore), gA = parseInt(guess.awayScore);
  const aH = parseInt(actual.homeScore), aA = parseInt(actual.awayScore);
  const gWinner = gH > gA ? 'home' : gH < gA ? 'away' : 'draw';
  const aWinner = aH > aA ? 'home' : aH < aA ? 'away' : 'draw';
  const exactHome = gH === aH, exactAway = gA === aA;
  const exactBoth = exactHome && exactAway;
  const correctWinner = gWinner === aWinner;

  if (aWinner === 'draw') {
    if (exactBoth) return { points: 5, label: "Placar exato (empate)" };
    if (correctWinner) return { points: 3, label: "Acertou empate" };
    return { points: 0, label: "Errou" };
  }
  if (exactBoth) return { points: 5, label: "Placar exato completo!" };
  if (correctWinner && (exactHome || exactAway)) return { points: 3, label: "Vencedor + 1 placar" };
  if (correctWinner) return { points: 2, label: "Acertou vencedor" };
  if (exactHome || exactAway) return { points: 1, label: "1 placar correto" };
  return { points: 0, label: "Errou" };
}

// Pontuação FINAL: aplica peso de fase e +2 se acertar quem avança (mata-mata).
function scoreMatch(guess, actual, match) {
  const base = calcScore(guess, actual);
  if (base === null) return null;
  const w = phaseWeight(match.phase);
  let placarPts = Math.round(base.points * w);
  let bonus = 0;
  let label = base.label;
  if (match.phase !== "Grupos") {
    const guessAdv = guess.advance;
    const realAdv = knockoutAdvancer(actual);
    if (guessAdv && realAdv && guessAdv === realAdv) {
      bonus = ADVANCE_BONUS;
      label = base.points > 0 ? base.label + " + avanço" : "Acertou quem avança";
    }
  }
  return { points: placarPts + bonus, label, base: base.points, weight: w, bonus };
}

// Quem avança num resultado de mata-mata (considera pênaltis via actual.advance).
function knockoutAdvancer(actual){
  if(!actual || actual.homeScore===null || actual.homeScore===undefined) return null;
  const h=parseInt(actual.homeScore), a=parseInt(actual.awayScore);
  if(h>a) return "home";
  if(a>h) return "away";
  return actual.advance || null;
}

function getMatchDateTime(m) {
  const [h, min] = m.time.split(":").map(Number);
  const hStr = String(h).padStart(2,"0");
  const minStr = String(min).padStart(2,"0");
  return new Date(m.date + "T" + hStr + ":" + minStr + ":00-03:00");
}
function isLocked(m) {
  return new Date() >= new Date(getMatchDateTime(m).getTime() - 5 * 60000);
}
function minsToLock(m) {
  const diff = getMatchDateTime(m).getTime() - 5*60000 - Date.now();
  return Math.max(0, Math.floor(diff / 60000));
}
function formatDate(ds) {
  const d = new Date(ds + "T12:00:00");
  return d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}).replace(".","").toUpperCase();
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}

              : <span style={{fontSize:"0.65rem",color:"#475569"}}>🔒</span>
            )
          ) : (
            changed && canSave ? (
              <button onClick={doSave} disabled={saving}
                style={{background:"#1d4ed8",border:"none",borderRadius:6,padding:"4px 8px",color:"#fff",fontSize:"0.7rem",fontWeight:700,cursor:"pointer",letterSpacing:"0.04em"}}>{saving?"...":"SALVAR"}</button>
            ) : (
              mins <= 60 && mins > 0 ? <span style={{fontSize:"0.6rem",color:"#f59e0b"}}>🕐{mins}min</span>
              : myBet?.homeScore!==undefined ? <span style={{fontSize:"0.65rem",color:"#10b981"}}>✓</span>
              : null
            )
          )}
        </div>
      </div>

      {/* Seletor quem avança (mata-mata empatado) */}
      {!locked && isKO && isDraw && (
        <div style={{marginTop:6,display:"flex",alignItems:"center",gap:6,justifyContent:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:"0.62rem",color:"#fbbf24"}}>Empate! Quem avança (pênaltis)?</span>
          <button onClick={()=>setAdv("home")} style={{padding:"3px 8px",borderRadius:6,border:"none",fontSize:"0.62rem",fontWeight:700,cursor:"pointer",background:adv==="home"?"#1d4ed8":"rgba(255,255,255,0.06)",color:adv==="home"?"#fff":"#94a3b8"}}>{homeFlag} {homeName}</button>
          <button onClick={()=>setAdv("away")} style={{padding:"3px 8px",borderRadius:6,border:"none",fontSize:"0.62rem",fontWeight:700,cursor:"pointer",background:adv==="away"?"#1d4ed8":"rgba(255,255,255,0.06)",color:adv==="away"?"#fff":"#94a3b8"}}>{awayFlag} {awayName}</button>
        </div>
      )}
      {/* Aviso slot pendente */}
      {!locked && anyPending && (
        <div style={{marginTop:5,fontSize:"0.58rem",color:"#fbbf24",textAlign:"center"}}>⚠ Confronto ainda não definido — você já pode palpitar o placar; o time aparece quando a fase anterior fechar.</div>
      )}

      {result?.homeScore!==undefined && result?.homeScore!==null && (
        <div style={{marginTop:4,paddingTop:4,borderTop:"1px solid rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:"0.62rem",color:"#475569",letterSpacing:"0.06em"}}>RESULTADO OFICIAL</span>
          <span style={{fontSize:"0.85rem",fontWeight:900,color:"#10b981"}}>{result.homeScore} – {result.awayScore}{isKO && parseInt(result.homeScore)===parseInt(result.awayScore) && result.advance && <span style={{fontSize:"0.58rem",color:"#fbbf24",marginLeft:5}}>(pen)</span>}</span>
          {score && <span style={{fontSize:"0.62rem",color:score.points>0?"#4ade80":"#64748b"}}>{score.label}</span>}
        </div>
      )}
    </div>
  );
}

// ABA BOLÃO
// ══════════════════════════════════════════════════════
function BolaoTab({ user, bets, results, onSaveBet, savingId, manualOrder, manualThirds }) {
  const [filter, setFilter] = useState("proximos"); // proximos | todos | encerrados
  const now = Date.now();
  const koTables = useMemo(() => computeAllGroups(results, manualOrder), [results, manualOrder]);
  const koThirds = useMemo(() => computeThirdsRanking(koTables), [koTables]);
  const koCtx = { tables: koTables, thirdsRanking: koThirds, results, manualThirds };
  const filtered = SCHEDULE.filter(m => {
    const dt = getMatchDateTime(m).getTime();
    if (filter === "proximos") return dt > now - 7200000 && dt < now + 86400000*3;
    if (filter === "encerrados") return dt < now - 7200000;
    return true;
  });
  const byDate = {};
  filtered.forEach(m => { if(!byDate[m.date]) byDate[m.date]=[]; byDate[m.date].push(m); });
  const myTotal = SCHEDULE.reduce((acc,m) => {
    const r = results[m.id]; const b = bets[m.id];
    if(!r||!b) return acc;
    const s = scoreMatch(b,r,m); return acc + (s?.points||0);
  },0);
  const betCount = Object.keys(bets).length;

  return (
    <div>
      {/* Mini stat do user */}
      <div style={{display:"flex",gap:10,marginBottom:12}}>
        <div style={{flex:1,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
          <div style={{fontSize:"1.4rem",fontWeight:900,color:"#ffd700"}}>{myTotal}</div>
          <div style={{fontSize:"0.6rem",color:"#64748b",letterSpacing:"0.08em"}}>PONTOS</div>
        </div>
        <div style={{flex:1,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
          <div style={{fontSize:"1.4rem",fontWeight:900,color:"#93c5fd"}}>{betCount}</div>
          <div style={{fontSize:"0.6rem",color:"#64748b",letterSpacing:"0.08em"}}>PALPITES</div>
        </div>
        <div style={{flex:1,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
          <div style={{fontSize:"1.4rem",fontWeight:900,color:"#4ade80"}}>{SCHEDULE.length-betCount}</div>
          <div style={{fontSize:"0.6rem",color:"#64748b",letterSpacing:"0.08em"}}>FALTAM</div>
        </div>
      </div>
      {/* Filtros */}
      <div style={{display:"flex",gap:6,marginBottom:12}}>
        {[["proximos","⚡ PRÓXIMOS"],["todos","📋 TODOS"],["encerrados","✅ ENCERRADOS"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{
            flex:1,padding:"6px 4px",borderRadius:20,border:"none",fontSize:"0.62rem",fontWeight:700,
            letterSpacing:"0.04em",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",
            background:filter===v?"#1d4ed8":"rgba(255,255,255,0.05)",color:filter===v?"#fff":"#64748b"
          }}>{l}</button>
        ))}
      </div>
      {/* Jogos */}
      {Object.keys(byDate).sort().map(date=>(
        <div key={date} style={{marginBottom:16}}>
          <div style={{background:"linear-gradient(90deg,rgba(30,58,95,0.6),transparent)",borderLeft:"3px solid #1d4ed8",padding:"5px 12px",borderRadius:"4px 4px 0 0",marginBottom:1}}>
            <span style={{fontSize:"0.75rem",fontWeight:800,letterSpacing:"0.12em",color:"#93c5fd"}}>{formatDate(date)}</span>
          </div>
          {byDate[date].map(m=>(
            <MatchBet key={m.id} match={m} myBet={bets[m.id]} result={results[m.id]}
              resolved={m.phase!=="Grupos" ? resolveKnockoutMatch(m, koCtx) : null}
              onSaveBet={onSaveBet} saving={savingId===m.id}/>
          ))}
        </div>
      ))}
      {filtered.length===0&&<div style={{textAlign:"center",padding:40,color:"#475569"}}>Nenhum jogo neste filtro</div>}
    </div>
  );
}

// ABA RANKING
// ══════════════════════════════════════════════════════
function RankingTab({ allBets, results, currentUser }) {
  const [detail, setDetail] = useState(null);
  const players = useMemo(() => {
    const map = {};
    Object.entries(allBets).forEach(([user, bets]) => {
      let pts = 0, exact = 0, winner = 0, count = 0;
      SCHEDULE.forEach(m => {
        const r = results[m.id]; const b = bets[m.id];
        if (!r || !b) return;
        const s = scoreMatch(b, r, m); if (!s) return;
        pts += s.points; count++;
        if (s.base === 5) exact++;
        else if (s.base >= 2) winner++;
      });
      map[user] = { user, pts, exact, winner, bets, count };
    });
    return Object.values(map).sort((a,b) => b.pts - a.pts || b.exact - a.exact);
  }, [allBets, results]);

  const medals = ["🥇","🥈","🥉"];
  return (
    <div>
      {detail ? (
        <div>
          <button onClick={()=>setDetail(null)} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:"6px 14px",color:"#94a3b8",fontSize:"0.8rem",cursor:"pointer",marginBottom:14,fontFamily:"'Barlow Condensed',sans-serif"}}>
            ← VOLTAR
          </button>
          <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,padding:"12px 16px",marginBottom:12}}>
            <div style={{fontSize:"1.2rem",fontWeight:900,color:"#ffd700"}}>{detail.user}</div>
            <div style={{display:"flex",gap:12,marginTop:6}}>
              <span style={{fontSize:"0.72rem",color:"#94a3b8"}}>{detail.pts} pts</span>
              <span style={{fontSize:"0.72rem",color:"#4ade80"}}>{detail.exact} placares exatos</span>
              <span style={{fontSize:"0.72rem",color:"#f59e0b"}}>{detail.winner} acertou vencedor</span>
            </div>
          </div>
          {SCHEDULE.filter(m=>detail.bets[m.id]).map(m => {
            const b = detail.bets[m.id]; const r = results[m.id];
            const s = r?.homeScore!==undefined ? scoreMatch(b,r,m) : null;
            return (
              <div key={m.id} style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:6,padding:"8px 12px",marginBottom:2,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span style={{fontSize:"0.78rem",color:"#94a3b8",flex:1}}>{m.homeFlag} {m.home} × {m.away} {m.awayFlag}</span>
                <span style={{fontSize:"0.85rem",fontWeight:700,color:"#fff",margin:"0 10px"}}>{b.homeScore} – {b.awayScore}</span>
                {s ? <span style={{fontSize:"0.7rem",fontWeight:700,color:s.points>=5?"#ffd700":s.points>=3?"#4ade80":s.points>=1?"#f59e0b":"#475569",minWidth:28,textAlign:"right"}}>{s.points>0?`+${s.points}`:"✗"}</span> : <span style={{minWidth:28}}></span>}
              </div>
            );
          })}
        </div>
      ) : (
        <>
          <div style={{marginBottom:12,padding:"10px 12px",background:"rgba(255,215,0,0.05)",border:"1px solid rgba(255,215,0,0.15)",borderRadius:8,fontSize:"0.7rem",color:"#94a3b8",lineHeight:1.7}}>
            <div style={{marginBottom:6}}><strong style={{color:"#ffd700"}}>Pontuação base (placar):</strong> Placar exato = 5 · Vencedor + 1 placar = 3 · Só vencedor = 2 · 1 placar certo = 1 · Empate exato = 5 · Só empate = 3</div>
            <div style={{marginBottom:6}}><strong style={{color:"#93c5fd"}}>Pesos por fase (multiplicam o placar):</strong> Grupos 1× · 16avos 1× · Oitavas 1,5× · Quartas 2× · Semi 3× · 3º lugar 2× · Final 4×</div>
            <div><strong style={{color:"#4ade80"}}>Mata-mata:</strong> +2 pts se acertar quem avança (no empate, vale a decisão dos pênaltis).</div>
          </div>
          {players.length === 0 ? (
            <div style={{textAlign:"center",padding:40,color:"#475569"}}>Nenhum participante ainda</div>
          ) : players.map((p, i) => (
            <div key={p.user} onClick={()=>setDetail(p)}
              style={{background:p.user===currentUser?"rgba(29,78,216,0.12)":"rgba(255,255,255,0.03)",border:`1px solid ${p.user===currentUser?"rgba(29,78,216,0.3)":"rgba(255,255,255,0.07)"}`,borderRadius:8,padding:"10px 14px",marginBottom:6,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
              <div style={{fontSize:"1.3rem",minWidth:28,textAlign:"center"}}>{medals[i] || `${i+1}º`}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:"0.95rem",fontWeight:700,color:p.user===currentUser?"#93c5fd":"#fff"}}>{p.user}{p.user===currentUser?" (você)":""}</div>
                <div style={{fontSize:"0.65rem",color:"#64748b",marginTop:2}}>{p.count} palpites · {p.exact} exatos · {p.winner} vencedores</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:"1.5rem",fontWeight:900,color:i===0?"#ffd700":i===1?"#94a3b8":i===2?"#cd7f32":"#e2e8f0"}}>{p.pts}</div>
                <div style={{fontSize:"0.55rem",color:"#64748b",letterSpacing:"0.08em"}}>PONTOS</div>
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// ABA TABELA (monitor original)
// ══════════════════════════════════════════════════════
function TabelaTab({ results, onFetch, fetchingId, globalFetching }) {
  const [phase, setPhase] = useState("Todos");
  const [group, setGroup] = useState("Todos");
  const [search, setSearch] = useState("");
  const PHASES = ["Todos","Grupos","2ª Fase","Oitavas","Quartas","Semifinal","3º Lugar","Final"];
  const GROUPS = ["Todos","A","B","C","D","E","F","G","H","I","J","K","L"];
  const filtered = SCHEDULE.filter(m => {
    if (phase !== "Todos" && m.phase !== phase) return false;
    if (group !== "Todos" && m.group !== group) return false;
    if (search) { const q=search.toLowerCase(); if(!m.home.toLowerCase().includes(q)&&!m.away.toLowerCase().includes(q)) return false; }
    return true;
  });
  const byDate = {};
  filtered.forEach(m => { if(!byDate[m.date]) byDate[m.date]=[]; byDate[m.date].push(m); });

  return (
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
        <button onClick={onFetch} disabled={globalFetching}
          style={{background:globalFetching?"#1e3a5f":"linear-gradient(135deg,#1d4ed8,#059669)",border:"none",borderRadius:6,padding:"6px 14px",color:"#fff",fontSize:"0.75rem",fontWeight:700,letterSpacing:"0.06em",cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontFamily:"'Barlow Condensed',sans-serif"}}>
          <span style={{display:"inline-block",animation:globalFetching?"spin 1s linear infinite":"none"}}>↻</span>
          {globalFetching?"BUSCANDO...":"ATUALIZAR"}
        </button>
      </div>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar seleção..."
        style={{width:"100%",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"7px 12px",color:"#fff",fontSize:"0.85rem",marginBottom:8,outline:"none",fontFamily:"'Barlow Condensed',sans-serif"}}/>
      <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
        {PHASES.map(p=>(
          <button key={p} onClick={()=>{setPhase(p);setGroup("Todos");}} style={{padding:"3px 9px",borderRadius:20,border:"none",fontSize:"0.65rem",fontWeight:700,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",background:phase===p?(PHASE_COLORS[p]||"#1d4ed8"):"rgba(255,255,255,0.04)",color:phase===p?"#fff":"#94a3b8"}}>{p}</button>
        ))}
      </div>
      {(phase==="Todos"||phase==="Grupos")&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:8}}>
          {GROUPS.map(g=>(
            <button key={g} onClick={()=>setGroup(g)} style={{padding:"2px 8px",borderRadius:20,border:"none",fontSize:"0.62rem",fontWeight:700,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",background:group===g?"#f59e0b":"rgba(255,255,255,0.04)",color:group===g?"#000":"#94a3b8"}}>G{g==="Todos"?"✦":g}</button>
          ))}
        </div>
      )}
      {Object.keys(byDate).sort().map(date=>(
        <div key={date} style={{marginBottom:16}}>
          <div style={{background:"linear-gradient(90deg,rgba(30,58,95,0.6),transparent)",borderLeft:"3px solid #1d4ed8",padding:"5px 12px",borderRadius:"4px 4px 0 0",marginBottom:1}}>
            <span style={{fontSize:"0.75rem",fontWeight:800,letterSpacing:"0.12em",color:"#93c5fd"}}>{formatDate(date)}</span>
          </div>
          {byDate[date].map((m,i)=>{
            const r = results[m.id]; const loading = fetchingId===m.id; const ph = PHASE_COLORS[m.phase]||"#3b82f6";
            return (
              <div key={m.id} style={{
                background:m.featured?"linear-gradient(135deg,rgba(250,204,21,0.07),rgba(16,185,129,0.05))":"rgba(255,255,255,0.03)",
                border:`1px solid ${m.featured?"rgba(250,204,21,0.15)":"rgba(255,255,255,0.06)"}`,
                borderLeft:`3px solid ${r?.status==="finished"?"#10b981":r?.status==="live"?"#ef4444":ph}`,
                borderRadius:i===byDate[date].length-1?"0 0 6px 6px":0,marginBottom:1,padding:"9px 12px"
              }}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{minWidth:36,textAlign:"center"}}>
                    <div style={{fontSize:"0.7rem",fontWeight:700,color:"#94a3b8"}}>{m.time}</div>
                    {m.group!=="-"&&<div style={{fontSize:"0.5rem",color:ph,fontWeight:800}}>G{m.group}</div>}
                  </div>
                  <div style={{flex:1,display:"flex",alignItems:"center",gap:4,justifyContent:"flex-end",minWidth:0}}>
                    <span style={{fontSize:"0.78rem",color:"#cbd5e1",textAlign:"right",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.home}</span>
                    <span style={{flexShrink:0}}>{m.homeFlag}</span>
                  </div>
                  <div style={{minWidth:56,textAlign:"center"}}>
                    {r?.status==="finished"||r?.status==="live" ? (
                      <span style={{fontSize:"1.3rem",fontWeight:900,color:r.status==="live"?"#ef4444":"#fff"}}>{r.homeScore}–{r.awayScore}</span>
                    ) : <span style={{fontSize:"0.75rem",color:"#334155",fontWeight:700}}>vs</span>}
                    {r?.status==="live"&&<div style={{fontSize:"0.5rem",color:"#ef4444",fontWeight:800}}>AO VIVO</div>}
                  </div>
                  <div style={{flex:1,display:"flex",alignItems:"center",gap:4,minWidth:0}}>
                    <span style={{flexShrink:0}}>{m.awayFlag}</span>
                    <span style={{fontSize:"0.78rem",color:"#cbd5e1",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.away}</span>
                  </div>
                  <button onClick={()=>onFetch(m)} disabled={loading||globalFetching} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:"4px 7px",fontSize:"0.8rem",color:"#94a3b8",cursor:"pointer",flexShrink:0}}>
                    {loading?"⌛":"↻"}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// PAINEL ADMIN
// ══════════════════════════════════════════════════════
function AdminPanel({ results, allBets, onSetResult, onSetThird, onSetGroupOrder, manualOrder, manualThirds, onClose }) {
  const [section, setSection] = useState("resultado"); // resultado | terceiros | grupos
  const [sel, setSel] = useState(null);
  const [h, setH] = useState(""); const [a, setA] = useState(""); const [adv, setAdv] = useState(""); const [saving, setSaving] = useState(false);
  const [filterPhase, setFilterPhase] = useState("Grupos");
  const upcoming = SCHEDULE.filter(m => m.phase === filterPhase);

  const tables = useMemo(() => computeAllGroups(results, manualOrder), [results, manualOrder]);
  const thirdsRanking = useMemo(() => computeThirdsRanking(tables), [tables]);

  const selIsKO = sel && sel.phase !== "Grupos";
  const selIsDraw = sel && h!=="" && a!=="" && parseInt(h)===parseInt(a);

  const handleSave = async () => {
    if (!sel || h==="" || a==="") return;
    if (selIsKO && selIsDraw && !adv) { alert("Empate em mata-mata: escolha quem avança (pênaltis)."); return; }
    setSaving(true);
    const advance = selIsKO ? (selIsDraw ? adv : (parseInt(h)>parseInt(a)?"home":"away")) : undefined;
    await onSetResult(sel.id, parseInt(h), parseInt(a), advance);
    setSaving(false); setH(""); setA(""); setAdv(""); setSel(null);
  };

  // Jogos de mata-mata que têm vaga de "Melhor 3º"
  const thirdMatches = SCHEDULE.filter(m => m.homeSlot?.t==="third" || m.awaySlot?.t==="third");
  // Lista de seleções que são 3º colocadas (candidatas)
  const thirdCandidates = thirdsRanking.map(t => ({name:t.team, flag:t.flag, group:t.group, rank: thirdsRanking.indexOf(t)+1}));

  const Tab = ({k,label}) => (
    <button onClick={()=>setSection(k)} style={{padding:"5px 12px",borderRadius:8,border:"none",fontSize:"0.7rem",fontWeight:700,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",background:section===k?"#1d4ed8":"rgba(255,255,255,0.06)",color:section===k?"#fff":"#94a3b8"}}>{label}</button>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:200,overflowY:"auto",padding:16}}>
      <div style={{maxWidth:600,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <h2 style={{color:"#ffd700",fontSize:"1.3rem",fontWeight:900,letterSpacing:"0.06em"}}>👑 PAINEL ADMIN</h2>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.08)",border:"none",borderRadius:6,padding:"6px 12px",color:"#94a3b8",cursor:"pointer"}}>FECHAR ×</button>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:14}}>
          <Tab k="resultado" label="🎯 RESULTADOS"/>
          <Tab k="terceiros" label="🥉 MELHOR 3º"/>
          <Tab k="grupos" label="📊 DESEMPATE"/>
        </div>

        {section==="resultado" && (<>
        <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:16,marginBottom:16}}>
          <p style={{color:"#93c5fd",fontSize:"0.8rem",fontWeight:700,letterSpacing:"0.06em",marginBottom:10}}>DEFINIR RESULTADO OFICIAL</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>
            {["Grupos","2ª Fase","Oitavas","Quartas","Semifinal","3º Lugar","Final"].map(p=>(
              <button key={p} onClick={()=>{setFilterPhase(p);setSel(null);}} style={{padding:"3px 10px",borderRadius:20,border:"none",fontSize:"0.65rem",fontWeight:700,cursor:"pointer",background:filterPhase===p?"#1d4ed8":"rgba(255,255,255,0.06)",color:filterPhase===p?"#fff":"#64748b"}}>{p}</button>
            ))}
          </div>
          <select value={sel?.id||""} onChange={e=>{ const m=SCHEDULE.find(x=>x.id===parseInt(e.target.value)); setSel(m); const r=results[m?.id]; setH(r?.homeScore??""); setA(r?.awayScore??""); setAdv(r?.advance??""); }}
            style={{width:"100%",background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,padding:"8px 10px",color:"#fff",fontSize:"0.85rem",marginBottom:10,outline:"none"}}>
            <option value="">Selecione um jogo...</option>
            {upcoming.map(m=>(
              <option key={m.id} value={m.id}>{m.time} · {m.home} × {m.away} {results[m.id]?.homeScore!==undefined?`(${results[m.id].homeScore}-${results[m.id].awayScore})`:""}</option>
            ))}
          </select>
          {sel && (<>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{color:"#fff",flex:1,fontSize:"0.85rem"}}>{sel.homeFlag} {sel.home}</span>
              <input type="number" min="0" max="30" value={h} onChange={e=>setH(e.target.value)} style={{width:44,height:36,textAlign:"center",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:6,color:"#fff",fontSize:"1.1rem",fontWeight:700,outline:"none"}}/>
              <span style={{color:"#475569",fontWeight:700}}>–</span>
              <input type="number" min="0" max="30" value={a} onChange={e=>setA(e.target.value)} style={{width:44,height:36,textAlign:"center",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:6,color:"#fff",fontSize:"1.1rem",fontWeight:700,outline:"none"}}/>
              <span style={{color:"#fff",flex:1,fontSize:"0.85rem",textAlign:"right"}}>{sel.away} {sel.awayFlag}</span>
            </div>
            {selIsKO && selIsDraw && (
              <div style={{marginTop:10,padding:"8px 10px",background:"rgba(250,204,21,0.08)",borderRadius:8}}>
                <p style={{fontSize:"0.68rem",color:"#fbbf24",marginBottom:6}}>Empate no tempo normal/prorrogação → quem venceu nos pênaltis?</p>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setAdv("home")} style={{flex:1,padding:"6px",borderRadius:6,border:"none",fontSize:"0.72rem",fontWeight:700,cursor:"pointer",background:adv==="home"?"#059669":"rgba(255,255,255,0.06)",color:adv==="home"?"#fff":"#94a3b8"}}>{sel.homeFlag} {sel.home}</button>
                  <button onClick={()=>setAdv("away")} style={{flex:1,padding:"6px",borderRadius:6,border:"none",fontSize:"0.72rem",fontWeight:700,cursor:"pointer",background:adv==="away"?"#059669":"rgba(255,255,255,0.06)",color:adv==="away"?"#fff":"#94a3b8"}}>{sel.away} {sel.awayFlag}</button>
                </div>
              </div>
            )}
            <div style={{textAlign:"right",marginTop:10}}>
              <button onClick={handleSave} disabled={saving} style={{background:"#059669",border:"none",borderRadius:6,padding:"8px 18px",color:"#fff",fontSize:"0.8rem",fontWeight:700,cursor:"pointer"}}>{saving?"...":"SALVAR RESULTADO"}</button>
            </div>
          </>)}
        </div>
        <p style={{color:"#93c5fd",fontSize:"0.8rem",fontWeight:700,letterSpacing:"0.06em",marginBottom:8}}>PALPITES POR JOGO</p>
        {SCHEDULE.filter(m=>m.phase===filterPhase).map(m => {
          const gameBets = Object.entries(allBets).filter(([,bets])=>bets[m.id]);
          if (!gameBets.length) return null;
          return (
            <div key={m.id} style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:8,padding:"10px 12px",marginBottom:8}}>
              <div style={{fontSize:"0.8rem",fontWeight:700,color:"#fff",marginBottom:6}}>{m.homeFlag} {m.home} × {m.away} {m.awayFlag} <span style={{color:"#64748b",fontWeight:400,fontSize:"0.7rem"}}>{m.date} {m.time}</span></div>
              {gameBets.map(([user,bets])=>{
                const b=bets[m.id]; const r=results[m.id]; const s=r?.homeScore!==undefined?scoreMatch(b,r,m):null;
                return (
                  <div key={user} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
                    <span style={{fontSize:"0.78rem",color:"#94a3b8"}}>{user}</span>
                    <span style={{fontSize:"0.85rem",fontWeight:700,color:"#fff"}}>{b.homeScore} – {b.awayScore}{b.advance?` (av: ${b.advance==="home"?"casa":"fora"})`:""}</span>
                    {s&&<span style={{fontSize:"0.72rem",fontWeight:700,color:s.points>0?"#4ade80":"#475569"}}>{s.points>0?`+${s.points}pts`:"✗"}</span>}
                  </div>
                );
              })}
            </div>
          );
        })}
        </>)}

        {section==="terceiros" && (
        <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:16}}>
          <p style={{color:"#fbbf24",fontSize:"0.8rem",fontWeight:700,letterSpacing:"0.06em",marginBottom:6}}>DEFINIR MELHOR 3º POR CHAVE</p>
          <p style={{fontSize:"0.66rem",color:"#64748b",marginBottom:12}}>Ranking automático sugere os 8 melhores. Confirme/escolha a seleção de cada vaga "Melhor 3º".</p>
          {thirdMatches.map(m => {
            const side = m.homeSlot?.t==="third" ? "home" : "away";
            const chave = m.chaveNum ? ("Chave "+m.chaveNum) : ("Jogo "+m.id);
            const opponent = side==="home" ? m.away : m.home;
            const current = manualThirds && manualThirds[m.id];
            return (
              <div key={m.id} style={{background:"rgba(255,255,255,0.02)",borderRadius:8,padding:"8px 10px",marginBottom:8,borderLeft:`3px solid ${current?"#10b981":"#fbbf24"}`}}>
                <div style={{fontSize:"0.72rem",color:"#cbd5e1",marginBottom:6}}>{chave}: <strong style={{color:current?"#4ade80":"#fbbf24"}}>{current||"Melhor 3º"}</strong> × {opponent}</div>
                <select value={current||""} onChange={e=>onSetThird(m.id, e.target.value)}
                  style={{width:"100%",background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:6,padding:"5px 8px",color:"#fff",fontSize:"0.78rem",outline:"none"}}>
                  <option value="">— escolher seleção —</option>
                  {thirdCandidates.map(c => (
                    <option key={c.name} value={c.name}>{c.rank}º melhor 3º · {c.name} (G{c.group}){c.rank<=8?" ✓":" (fora do top8)"}</option>
                  ))}
                </select>
              </div>
            );
          })}
        </div>
        )}

        {section==="grupos" && (
        <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:16}}>
          <p style={{color:"#fbbf24",fontSize:"0.8rem",fontWeight:700,letterSpacing:"0.06em",marginBottom:6}}>DESEMPATE MANUAL DE GRUPOS</p>
          <p style={{fontSize:"0.66rem",color:"#64748b",marginBottom:12}}>Grupos com ⚠ têm empate em Pts/Saldo/Gols pró. Use as setas para definir a ordem final (confronto direto / fair play).</p>
          {GROUP_LETTERS.map(g => {
            const t = tables[g];
            const hasTie = t.some(x => x.tieFlag);
            if (!hasTie) return null;
            const move = (idx, dir) => {
              const order = t.map(x=>x.team);
              const ni = idx+dir;
              if (ni<0||ni>=order.length) return;
              [order[idx],order[ni]]=[order[ni],order[idx]];
              onSetGroupOrder(g, order);
            };
            return (
              <div key={g} style={{background:"rgba(250,204,21,0.05)",borderRadius:8,padding:"8px 10px",marginBottom:8}}>
                <div style={{fontSize:"0.75rem",fontWeight:800,color:"#fbbf24",marginBottom:6}}>GRUPO {g} ⚠</div>
                {t.map((tm,i)=>(
                  <div key={tm.team} style={{display:"flex",alignItems:"center",gap:6,padding:"3px 0"}}>
                    <span style={{minWidth:14,fontSize:"0.7rem",color:"#94a3b8"}}>{i+1}</span>
                    <span>{tm.flag}</span>
                    <span style={{flex:1,fontSize:"0.76rem",color:"#e2e8f0"}}>{tm.team}</span>
                    <span style={{fontSize:"0.62rem",color:"#64748b"}}>{tm.pts}pts · {tm.sg>0?"+":""}{tm.sg}</span>
                    <button onClick={()=>move(i,-1)} disabled={i===0} style={{background:"rgba(255,255,255,0.08)",border:"none",borderRadius:4,padding:"2px 6px",color:"#fff",cursor:"pointer",fontSize:"0.7rem"}}>↑</button>
                    <button onClick={()=>move(i,1)} disabled={i===t.length-1} style={{background:"rgba(255,255,255,0.08)",border:"none",borderRadius:4,padding:"2px 6px",color:"#fff",cursor:"pointer",fontSize:"0.7rem"}}>↓</button>
                  </div>
                ))}
              </div>
            );
          })}
          {!GROUP_LETTERS.some(g => tables[g].some(x=>x.tieFlag)) && (
            <p style={{fontSize:"0.72rem",color:"#64748b",textAlign:"center",padding:20}}>Nenhum empate pendente. Todas as ordens estão definidas automaticamente. ✓</p>
          )}
        </div>
        )}
      </div>
    </div>
  );
}

// ABA CLASSIFICAÇÃO (tabelas dos grupos + melhores terceiros)
// ══════════════════════════════════════════════════════

  const tables = useMemo(() => computeAllGroups(results, manualOrder), [results, manualOrder]);
  const thirds = useMemo(() => computeThirdsRanking(tables), [tables]);
  const stageDone = groupStageComplete(results);

  const Row = ({ t, pos, highlight }) => (
    <div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",
      background: highlight ? "rgba(16,185,129,0.06)" : t.tieFlag ? "rgba(250,204,21,0.08)" : "transparent",
      borderRadius:4,borderLeft:`3px solid ${pos<=2?"#10b981":pos===3?"#f59e0b":"#334155"}`}}>
      <span style={{minWidth:16,fontSize:"0.72rem",fontWeight:800,color:pos<=2?"#4ade80":pos===3?"#fbbf24":"#64748b"}}>{pos}</span>
      <span style={{fontSize:"0.95rem"}}>{t.flag}</span>
      <span style={{flex:1,fontSize:"0.78rem",color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
        {t.team}{t.tieFlag && <span title="Empate nos critérios automáticos" style={{color:"#fbbf24",marginLeft:4}}>⚠</span>}
      </span>
      <span style={{minWidth:20,textAlign:"center",fontSize:"0.7rem",color:"#64748b"}}>{t.j}</span>

  return (
    <div>
      <div style={{marginBottom:12,padding:"8px 12px",background:"rgba(59,130,246,0.06)",border:"1px solid rgba(59,130,246,0.15)",borderRadius:8,fontSize:"0.72rem",color:"#94a3b8",lineHeight:1.6}}>
        Classificam <strong style={{color:"#4ade80"}}>2 primeiros</strong> de cada grupo + os <strong style={{color:"#fbbf24"}}>8 melhores 3º</strong>. Ordem: Pts → Saldo → Gols pró. <span style={{color:"#fbbf24"}}>⚠ = empate</span> que precisa de critério manual (confronto direto / fair play).

          const t = tables[g];
          return (
            <div key={g} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,padding:"8px 10px"}}>

                <span style={{fontSize:"0.85rem",fontWeight:900,color:"#93c5fd",letterSpacing:"0.08em"}}>GRUPO {g}</span>
                <span style={{fontSize:"0.55rem",color:"#475569"}}>J · SG · PTS</span>

            </div>
          );

      </div>

      {/* Ranking dos terceiros */}
      <div style={{background:"rgba(250,204,21,0.04)",border:"1px solid rgba(250,204,21,0.15)",borderRadius:8,padding:"10px 12px"}}>
        <div style={{fontSize:"0.85rem",fontWeight:900,color:"#fbbf24",letterSpacing:"0.06em",marginBottom:8}}>🥉 MELHORES 3º COLOCADOS</div>
        <div style={{fontSize:"0.65rem",color:"#64748b",marginBottom:8}}>Os 8 primeiros avançam {stageDone ? "(definido)" : "(parcial — grupos em andamento)"}.</div>
        {thirds.map((t, i) => (
          <div key={t.group} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 8px",marginBottom:2,borderRadius:4,
            background: i<8 ? "rgba(16,185,129,0.07)" : "rgba(248,113,113,0.05)",
            borderLeft:`3px solid ${i<8?"#10b981":"#f87171"}`}}>
            <span style={{minWidth:18,fontSize:"0.72rem",fontWeight:800,color:i<8?"#4ade80":"#f87171"}}>{i+1}</span>
            <span>{t.flag}</span>
            <span style={{flex:1,fontSize:"0.78rem",color:"#e2e8f0"}}>{t.team} <span style={{color:"#475569",fontSize:"0.62rem"}}>(Grupo {t.group})</span>{t.tieFlag && <span style={{color:"#fbbf24",marginLeft:4}}>⚠</span>}</span>
            <span style={{fontSize:"0.7rem",color:"#94a3b8"}}>{t.pts}pts · {t.sg>0?"+":""}{t.sg}</span>
            <span style={{fontSize:"0.6rem",fontWeight:800,color:i<8?"#4ade80":"#f87171",minWidth:48,textAlign:"right"}}>{i<8?"CLASSIF.":"ELIM."}</span>

}


// ══════════════════════════════════════════════════════
// ABA CHAVEAMENTO (mata-mata: propagação + palpites)
// ══════════════════════════════════════════════════════
function KnockoutMatch({ match, resolved, myBet, result, onSaveBet, saving }) {
  const [h, setH] = useState(myBet?.homeScore ?? "");
  const [a, setA] = useState(myBet?.awayScore ?? "");
  const [adv, setAdv] = useState(myBet?.advance ?? "");
  const locked = isLocked(match);
  const phaseColor = PHASE_COLORS[match.phase] || "#8b5cf6";
  const score = myBet && result?.homeScore!==null && result?.homeScore!==undefined
    ? scoreMatch({homeScore:myBet.homeScore,awayScore:myBet.awayScore,advance:myBet.advance}, result, match) : null;

  const homeName = resolved?.home?.team || match.home;
  const awayName = resolved?.away?.team || match.away;
  const homeFlag = resolved?.home?.flag || match.homeFlag;
  const awayFlag = resolved?.away?.flag || match.awayFlag;
  const homePending = !resolved?.home;
  const awayPending = !resolved?.away;
  // palpite empatado no tempo normal exige escolher quem avança
  const isDraw = h!=="" && a!=="" && parseInt(h)===parseInt(a);
  const changed = String(h)!==String(myBet?.homeScore??"") || String(a)!==String(myBet?.awayScore??"") || String(adv)!==String(myBet?.advance??"");
  const canSave = h!=="" && a!=="" && (!isDraw || adv!=="");

  const Side = ({name, flag, pending, align}) => (
    <div style={{flex:1,display:"flex",alignItems:"center",gap:4,justifyContent:align==="right"?"flex-end":"flex-start",minWidth:0}}>
      {align!=="right" && <span style={{fontSize:"1rem",flexShrink:0}}>{flag}</span>}
      <span style={{fontSize:"0.76rem",textAlign:align,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",
        color: pending ? "#fbbf24" : "#cbd5e1", fontStyle: pending ? "italic" : "normal"}}>{name}</span>
      {align==="right" && <span style={{fontSize:"1rem",flexShrink:0}}>{flag}</span>}
    </div>
  );

  return (
    <div style={{
      background: match.featured ? "linear-gradient(135deg,rgba(250,204,21,0.07),rgba(139,92,246,0.05))" : "rgba(255,255,255,0.03)",
      border:`1px solid rgba(255,255,255,0.07)`,
      borderLeft:`3px solid ${score?.points>0?"#10b981":locked?"#475569":phaseColor}`,
      borderRadius:6,padding:"10px 12px",marginBottom:3}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:"0.58rem",fontWeight:800,color:phaseColor,letterSpacing:"0.08em"}}>{match.chaveNum?("CHAVE "+match.chaveNum):match.oitava?("OITAVA "+match.oitava):match.quartaNum?("QUARTA "+match.quartaNum):match.semiNum?("SEMIFINAL "+match.semiNum):match.phase.toUpperCase()}</span>
        <span style={{fontSize:"0.58rem",color:"#475569"}}>{formatDate(match.date)} · {match.time}</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        <Side name={homeName} flag={homeFlag} pending={homePending} align="right"/>
        {locked ? (
          <div style={{minWidth:60,textAlign:"center"}}>
            {myBet?.homeScore!==undefined && myBet?.homeScore!==null ? (
              <span style={{fontSize:"1.3rem",fontWeight:900,color:score?.points>0?"#4ade80":"#fff"}}>{myBet.homeScore}<span style={{color:"#475569",fontSize:"0.85rem"}}>–</span>{myBet.awayScore}</span>
            ) : <span style={{fontSize:"0.65rem",color:"#475569"}}>sem palpite</span>}
          </div>
        ) : (
          <div style={{display:"flex",alignItems:"center",gap:3}}>
            <input type="number" min="0" max="30" value={h} onChange={e=>setH(e.target.value)} style={{width:34,height:30,textAlign:"center",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:6,color:"#fff",fontSize:"1rem",fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",outline:"none"}}/>
            <span style={{color:"#475569",fontWeight:700}}>–</span>
            <input type="number" min="0" max="30" value={a} onChange={e=>setA(e.target.value)} style={{width:34,height:30,textAlign:"center",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:6,color:"#fff",fontSize:"1rem",fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",outline:"none"}}/>
          </div>
        )}
        <Side name={awayName} flag={awayFlag} pending={awayPending} align="left"/>
      </div>

      {/* Seletor "quem avança" — aparece quando palpite empatado e não travado */}
      {!locked && isDraw && (
        <div style={{marginTop:6,display:"flex",alignItems:"center",gap:6,justifyContent:"center"}}>
          <span style={{fontSize:"0.62rem",color:"#fbbf24"}}>Empate! Quem avança (pênaltis)?</span>
          <button onClick={()=>setAdv("home")} style={{padding:"3px 8px",borderRadius:6,border:"none",fontSize:"0.62rem",fontWeight:700,cursor:"pointer",background:adv==="home"?"#1d4ed8":"rgba(255,255,255,0.06)",color:adv==="home"?"#fff":"#94a3b8"}}>{homeFlag} {homeName}</button>
          <button onClick={()=>setAdv("away")} style={{padding:"3px 8px",borderRadius:6,border:"none",fontSize:"0.62rem",fontWeight:700,cursor:"pointer",background:adv==="away"?"#1d4ed8":"rgba(255,255,255,0.06)",color:adv==="away"?"#fff":"#94a3b8"}}>{awayFlag} {awayName}</button>
        </div>
      )}

      {/* Ação salvar */}
      {!locked && changed && canSave && (
        <div style={{marginTop:6,textAlign:"center"}}>
          <button onClick={()=>onSaveBet(match.id, parseInt(h), parseInt(a), isDraw?adv:(parseInt(h)>parseInt(a)?"home":"away"))} disabled={saving}
            style={{background:"#1d4ed8",border:"none",borderRadius:6,padding:"5px 16px",color:"#fff",fontSize:"0.7rem",fontWeight:700,cursor:"pointer",letterSpacing:"0.04em"}}>{saving?"...":"SALVAR PALPITE"}</button>
        </div>
      )}

      {/* Resultado oficial */}
      {result?.homeScore!==undefined && result?.homeScore!==null && (
        <div style={{marginTop:6,paddingTop:6,borderTop:"1px solid rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:"0.6rem",color:"#475569",letterSpacing:"0.06em"}}>OFICIAL</span>
          <span style={{fontSize:"0.85rem",fontWeight:900,color:"#10b981"}}>
            {result.homeScore} – {result.awayScore}
            {parseInt(result.homeScore)===parseInt(result.awayScore) && result.advance && <span style={{fontSize:"0.6rem",color:"#fbbf24",marginLeft:6}}>(pen: {result.advance==="home"?homeName:awayName})</span>}
          </span>
          {score && <span style={{fontSize:"0.62rem",fontWeight:700,color:score.points>0?"#4ade80":"#64748b"}}>{score.points>0?`+${score.points}`:"✗"} {score.label}</span>}
        </div>
      )}
    </div>
  );
}

function ChaveamentoTab({ results, bets, onSaveBet, savingId, manualOrder, manualThirds }) {
  const tables = useMemo(() => computeAllGroups(results, manualOrder), [results, manualOrder]);
  const thirdsRanking = useMemo(() => computeThirdsRanking(tables), [tables]);
  const ctx = { tables, thirdsRanking, results, manualThirds };

  const PHASES = [
    {key:"2ª Fase", title:"16avos de final"},
    {key:"Oitavas", title:"Oitavas de final"},
    {key:"Quartas", title:"Quartas de final"},
    {key:"Semifinal", title:"Semifinais"},
    {key:"3º Lugar", title:"Disputa de 3º lugar"},
    {key:"Final", title:"Final"},
  ];
  const [phase, setPhase] = useState("2ª Fase");

  const matches = SCHEDULE.filter(m => m.phase===phase);
  const pendingThird = matches.some(m => (m.homeSlot?.t==="third" && !resolveMatchTeam(m,"home",ctx)) || (m.awaySlot?.t==="third" && !resolveMatchTeam(m,"away",ctx)));

  return (
    <div>
      <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:12}}>
        {PHASES.map(p => (
          <button key={p.key} onClick={()=>setPhase(p.key)} style={{padding:"5px 10px",borderRadius:20,border:"none",fontSize:"0.65rem",fontWeight:700,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",
            background:phase===p.key?(PHASE_COLORS[p.key]||"#8b5cf6"):"rgba(255,255,255,0.05)",color:phase===p.key?"#fff":"#94a3b8"}}>{p.title}</button>
        ))}
      </div>
      {pendingThird && (
        <div style={{marginBottom:10,padding:"7px 12px",background:"rgba(250,204,21,0.08)",border:"1px solid rgba(250,204,21,0.2)",borderRadius:8,fontSize:"0.68rem",color:"#fbbf24"}}>
          ⚠ Há vagas de "Melhor 3º" ainda não definidas. O admin pode escolher a seleção no Painel Admin.
        </div>
      )}
      {matches.map(m => (
        <KnockoutMatch key={m.id} match={m} resolved={resolveKnockoutMatch(m, ctx)} myBet={bets[m.id]} result={results[m.id]} onSaveBet={onSaveBet} saving={savingId===m.id}/>
      ))}
    </div>
  );
}


// ══════════════════════════════════════════════════════
// APP PRINCIPAL
// ══════════════════════════════════════════════════════
function App() {
  const [user, setUser] = useState(() => localStorage.getItem("bolao_user_v1") || null);
  const [tab, setTab] = useState("bolao");
  const [bets, setBets] = useState({});
  const [allBets, setAllBets] = useState({});
  const [results, setResults] = useState({});
  const [savingId, setSavingId] = useState(null);
  const [fetchingId, setFetchingId] = useState(null);
  const [globalFetching, setGlobalFetching] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [adminInput, setAdminInput] = useState("");
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [adminAuth, setAdminAuth] = useState(false);
  const [ticker, setTicker] = useState(0);
  const [manualOrder, setManualOrder] = useState({});   // override de ordenacao de grupos
  const [manualThirds, setManualThirds] = useState({});  // escolha de melhor 3o por jogo

  // Tick a cada minuto para atualizar timers
  useEffect(() => { const t = setInterval(()=>setTicker(x=>x+1),60000); return ()=>clearInterval(t); }, []);

  // Login persistente
  const handleLogin = (name) => { localStorage.setItem("bolao_user_v1",name); setUser(name); };
  const handleLogout = () => { localStorage.removeItem("bolao_user_v1"); setUser(null); setBets({}); };

  // Firebase listeners
  useEffect(() => {
    if (!db || !user) return;
    // Meus palpites
    const unsubBets = db.collection("bets").doc(user).onSnapshot(snap => {
      if (!snap.exists) { setBets({}); return; }
      const raw = snap.data() || {};
      const norm = {};
      Object.keys(raw).forEach(k => { norm[String(k)] = raw[k]; });
      setBets(norm);
    });
    // Resultados
    const unsubResults = db.collection("results").doc("official").onSnapshot(snap => {
      if (!snap.exists) { setResults({}); return; }
      const raw = snap.data() || {};
      const norm = {};
      Object.keys(raw).forEach(k => { norm[String(k)] = raw[k]; });
      setResults(norm);
    });
    // Todos os palpites (para ranking)
    const unsubAll = db.collection("bets").onSnapshot(snap => {
      const map = {};
      snap.forEach(d => {
        const raw = d.data() || {};
        const norm = {};
        Object.keys(raw).forEach(k => { norm[String(k)] = raw[k]; });
        map[d.id] = norm;
      });
      setAllBets({...map});
    });
    const unsubCfg = db.collection("config").doc("knockout").onSnapshot(snap => {
      const raw = snap.exists ? (snap.data()||{}) : {};
      setManualOrder(raw.manualOrder || {});
      setManualThirds(raw.manualThirds || {});
    });
    return () => { unsubBets(); unsubResults(); unsubAll(); unsubCfg(); };
  }, [user]);

  // Listener separado para allBets quando não há usuário logado
  useEffect(() => {
    if (!db || user) return; // só roda sem usuário logado (evita duplicata)
    const unsub = db.collection("bets").onSnapshot(snap => {
      const map = {};
      snap.forEach(d => {
        const raw = d.data() || {};
        const norm = {};
        Object.keys(raw).forEach(k => { norm[String(k)] = raw[k]; });
        map[d.id] = norm;
      });
      setAllBets({...map});
    });
    return () => unsub();
  }, [user]);

  // Salvar palpite
  const handleSaveBet = useCallback(async (matchId, h, a, advance) => {
    if (!db || !user) return;
    setSavingId(matchId);
    try {
      const payload = { homeScore: h, awayScore: a, at: new Date().toISOString() };
      if (advance) payload.advance = advance;
      await db.collection("bets").doc(user).set({ [matchId]: payload }, { merge: true });
    } catch(e) { console.error(e); }
    setSavingId(null);
  }, [user]);

  // Definir resultado (admin)
  const handleSetResult = useCallback(async (matchId, h, a, advance) => {
    if (!db) return;
    const payload = { homeScore: h, awayScore: a, status: "finished", updatedAt: new Date().toISOString() };
    if (advance) payload.advance = advance;
    await db.collection("results").doc("official").set({ [matchId]: payload }, { merge: true });
  }, []);

  const handleSetThird = useCallback(async (matchId, teamName) => {
    if (!db) return;
    await db.collection("config").doc("knockout").set({ manualThirds: { [matchId]: teamName } }, { merge: true });
  }, []);
  const handleSetGroupOrder = useCallback(async (groupLetter, orderArray) => {
    if (!db) return;
    await db.collection("config").doc("knockout").set({ manualOrder: { ["group_"+groupLetter]: orderArray } }, { merge: true });
  }, []);

  // Buscar resultado via Claude API
  const fetchResult = useCallback(async (match) => {
    if (!match) return;
    setFetchingId(match.id);
    const prompt = `Copa do Mundo 2026: ${match.home} x ${match.away} em ${match.date} às ${match.time} BRT. Busque o resultado. Responda SOMENTE JSON: {"status":"pending"|"finished"|"live","homeScore":número|null,"awayScore":número|null}`;
    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,tools:[{type:"web_search_20250305",name:"web_search"}],messages:[{role:"user",content:prompt}]})
      });
      const data = await resp.json();
      const txt = data.content?.find(b=>b.type==="text")?.text;
      if (txt) {
        const parsed = JSON.parse(txt.replace(/```json|```/g,"").trim());
        if (parsed.status==="finished"&&parsed.homeScore!==null) {
          await handleSetResult(match.id, parsed.homeScore, parsed.awayScore);
        }
      }
    } catch(e){console.error(e);}
    setFetchingId(null);
  }, [handleSetResult]);

  const fetchAll = useCallback(async () => {
    setGlobalFetching(true);
    const now = Date.now();
    const recent = SCHEDULE.filter(m => {
      const dt = getMatchDateTime(m).getTime();
      return dt < now + 3600000 && dt > now - 172800000;
    });
    for (const m of recent) { await fetchResult(m); }
    setGlobalFetching(false);
  }, [fetchResult]);

  if (!user) return <LoginScreen onLogin={handleLogin}/>;

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0a0f1e,#0d1b2a,#071a0d)",fontFamily:"'Barlow Condensed',Arial Narrow,sans-serif",color:"#e2e8f0"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800;900&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0f1e}::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:2px}
        @keyframes spin{to{transform:rotate(360deg)}}
        select option{background:#0d1b2a;color:#fff;}
      `}</style>

      {/* HEADER */}
      <header style={{background:"linear-gradient(180deg,rgba(0,0,0,0.92),rgba(10,15,30,0.96))",borderBottom:"1px solid rgba(255,215,0,0.15)",padding:"10px 16px",position:"sticky",top:0,zIndex:100,backdropFilter:"blur(10px)"}}>
        <div style={{maxWidth:700,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:"1.5rem"}}>⚽</span>
              <div>
                <div style={{fontSize:"1.1rem",fontWeight:900,letterSpacing:"0.04em",background:"linear-gradient(90deg,#ffd700,#fff,#4ade80)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",lineHeight:1}}>BOLÃO COPA 2026</div>
                <div style={{fontSize:"0.6rem",color:"#64748b",letterSpacing:"0.06em"}}>Olá, {user}!</div>
              </div>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <button onClick={()=>setShowAdminLogin(true)} style={{background:"rgba(255,215,0,0.08)",border:"1px solid rgba(255,215,0,0.15)",borderRadius:6,padding:"5px 8px",color:"#ffd700",fontSize:"0.7rem",cursor:"pointer"}}>👑</button>
              <button onClick={handleLogout} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:"5px 8px",color:"#64748b",fontSize:"0.7rem",cursor:"pointer"}}>Sair</button>
            </div>
          </div>
          {/* Tabs */}
          <div style={{display:"flex",gap:4,marginTop:8}}>
            {[["bolao","🎯 BOLÃO"],["classif","📊 CLASSIF."],["chave","🗝️ CHAVE"],["ranking","🏆 RANKING"],["tabela","📋 TABELA"]].map(([v,l])=>(
              <button key={v} onClick={()=>setTab(v)} style={{flex:1,padding:"6px 4px",borderRadius:8,border:"none",fontSize:"0.72rem",fontWeight:700,letterSpacing:"0.04em",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",
                background:tab===v?"#1d4ed8":"rgba(255,255,255,0.05)",color:tab===v?"#fff":"#64748b",
                borderBottom:tab===v?"2px solid #ffd700":"2px solid transparent"}}>{l}</button>
            ))}
          </div>
        </div>
      </header>

      <main style={{maxWidth:700,margin:"0 auto",padding:"14px 12px",paddingBottom:32}}>
        {tab==="bolao"&&<BolaoTab user={user} bets={bets} results={results} onSaveBet={handleSaveBet} savingId={savingId} manualOrder={manualOrder} manualThirds={manualThirds}/>}
        {tab==="classif"&&<ClassificacaoTab results={results} manualOrder={manualOrder}/>}
        {tab==="chave"&&<ChaveamentoTab results={results} bets={bets} onSaveBet={handleSaveBet} savingId={savingId} manualOrder={manualOrder} manualThirds={manualThirds}/>}
        {tab==="ranking"&&<RankingTab allBets={allBets} results={results} currentUser={user}/>}
        {tab==="tabela"&&<TabelaTab results={results} onFetch={(m)=>m?fetchResult(m):fetchAll()} fetchingId={fetchingId} globalFetching={globalFetching}/>}
      </main>

      {/* Admin login modal */}
      {showAdminLogin&&!adminAuth&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:150,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div style={{background:"#0d1b2a",border:"1px solid rgba(255,215,0,0.2)",borderRadius:12,padding:28,width:"100%",maxWidth:320}}>
            <h3 style={{color:"#ffd700",marginBottom:16,fontSize:"1rem",fontWeight:700}}>👑 Acesso Admin</h3>
            <input type="password" value={adminInput} onChange={e=>setAdminInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(adminInput===ADMIN_PASSWORD?(setAdminAuth(true),setShowAdmin(true),setShowAdminLogin(false)):alert("Senha incorreta"))}
              placeholder="Senha admin..." style={{width:"100%",background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,padding:"10px 12px",color:"#fff",fontSize:"1rem",outline:"none",marginBottom:10}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setShowAdminLogin(false)} style={{flex:1,background:"rgba(255,255,255,0.06)",border:"none",borderRadius:8,padding:10,color:"#94a3b8",cursor:"pointer"}}>Cancelar</button>
              <button onClick={()=>{ if(adminInput===ADMIN_PASSWORD){setAdminAuth(true);setShowAdmin(true);setShowAdminLogin(false);}else alert("Senha incorreta");}} style={{flex:1,background:"#1d4ed8",border:"none",borderRadius:8,padding:10,color:"#fff",fontWeight:700,cursor:"pointer"}}>Entrar</button>
            </div>
          </div>
        </div>
      )}

      {/* Admin panel */}
      {showAdmin&&adminAuth&&<AdminPanel results={results} allBets={allBets} onSetResult={handleSetResult} onSetThird={handleSetThird} onSetGroupOrder={handleSetGroupOrder} manualOrder={manualOrder} manualThirds={manualThirds} onClose={()=>setShowAdmin(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
